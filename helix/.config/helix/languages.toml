[langauage-server.pyrefly]
command = "pyrefly"
args = ["lsp"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["pyrefly", "ruff"]
auto-format = true
formatter = { command = "ruff", args = [
  "format",
  "--stdin-filename",
  "%{buffer_name}",
  "-",
] }

[[language]]
name = "toml"
auto-format = true
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "jinja"
file-types = [{ glob = "templates/**/*.html" }]
formatter = { command = "djlint", args = [
  "-",
  "--reformat",
  "--profile=jinja",
] }
auto-format = true


[[language]]
name = "html"
auto-format = true
formatter = { command = "djlint", args = [
  "-",
  "--reformat",
  "--profile=jinja",
] }
